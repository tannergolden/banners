# Put this at .github/workflows/elements.yml in any repository. The first
# run writes .github/elements.yml with the five elements that need nothing
# written by hand (instruments, plan, milestones, roster and certificate),
# puts a pair of markers for each at the foot of the README, measures the
# repository, draws every element into assets/elements/ and commits. Move
# the markers wherever you like; later runs rewrite only what is between
# them. Once a day it measures again and redraws whatever moved.
#
# GITHUB_TOKEN already reads everything about its own repository, so no
# extra token is needed unless a placard reads another one.
name: Elements

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  elements:
    permissions:
      contents: write
      pull-requests: write
    uses: tannergolden/banners/.github/workflows/elements.yml@v1
    # with:
    #   commit: pr # one evolving pull request instead of a push to the branch
