#
# The reusable workflow a consumer calls, for both kits in this repository:
# the banners at the two ends of the page, then the elements between them,
# in one run on one checkout. Their repository holds a stub that names the
# schedule and nothing else; the checkout, the measurement, the drawing and
# the commit all happen here, so a fix lands once and reaches every README
# pinned to @v1.
#
# The banners draw first and commit; the elements draw second, on the tree
# the banners just committed, and commit on their own. Each commit is the
# kit's own, with its own scope, so the log says which kit moved. A
# rainbowprint's colour is chosen by the banners and read by the elements
# from the lock the banners wrote a step earlier, which is why the two are
# one job and not two.
#
# Called, never copied: nothing with behavior in it is pasted into the
# consumer's tree.

name: '🪧 Banners'

on:
  workflow_call:
    inputs:
      mode:
        description: 'auto, profile or repository. Empty reads .github/banners.yml, whose default is auto.'
        type: string
        default: ''
      subject:
        description: 'A login (profile) or owner/name (repository). Empty means this repository, or its owner.'
        type: string
        default: ''
      header:
        description: 'section, sheet, strip or none. Empty reads the config, whose default is section.'
        type: string
        default: ''
      footer:
        description: 'title-block, scale-bar or none. Empty reads the config.'
        type: string
        default: ''
      theme:
        description: >-
          blueprint, redprint, orangeprint, yellowprint, greenprint,
          tealprint, indigoprint, purpleprint, pinkprint, brownprint,
          blackprint, or rainbowprint for the next colour on every update.
          Empty reads the config.
        type: string
        default: ''
      elements:
        description: >-
          Draw the elements too, the body of the page, after the banners in
          the same run: true by default. The first run writes
          .github/elements.yml and the README's markers; later runs measure
          and redraw. A profile README has no repository to measure, so
          profile mode draws none whatever this says. false leaves the body
          of the page alone.
        type: boolean
        default: true
      commit:
        description: 'push (default) commits to the current branch; pr opens or updates one pull request.'
        type: string
        default: 'push'
      commit-branch:
        description: 'The fixed branch the pull request rides on when commit is pr.'
        type: string
        default: 'chore/banners'
      kit-ref:
        description: >-
          The tannergolden/banners ref to run: the v1 tag by default. This
          repository's own banners pass its commit, so a change is exercised
          by the tree that carries it.
        type: string
        default: 'v1'
      author:
        description: >-
          Who the refresh commit is authored by, as "Name <email>". The
          kit's author by default, as for badges and trophies: the drawing
          is the kit's output, and the commit is signed for by the bot as
          committer. The kit recognises its own commits by their scope and
          never counts one as the repository's last change.
        type: string
        default: 'Tanner Golden <24684994+tannergolden@users.noreply.github.com>'
      check:
        description: >-
          true only checks: the committed banners, and the elements when
          there is a data file, are redrawn from the measurement each lock
          remembers and the run fails if any file or README block differs.
          Nothing is measured, written or committed, and no token is used.
          For pull-request CI.
        type: boolean
        default: false
    secrets:
      BANNERS_TOKEN:
        description: 'Optional token to measure with instead of GITHUB_TOKEN; nothing a banner shows needs one.'
        required: false
      ELEMENTS_TOKEN:
        description: >-
          Optional token for the elements; only a placard for another
          repository needs one. BANNERS_TOKEN serves when this is unset.
        required: false
    outputs:
      changed:
        description: "'true' when the run committed something, the banners or the elements."
        value: ${{ jobs.banners.outputs.changed }}
      summary:
        description: 'One line about the banners.'
        value: ${{ jobs.banners.outputs.summary }}
      elements-changed:
        description: "'true' when the elements were committed."
        value: ${{ jobs.banners.outputs.elements-changed }}

permissions: {}

jobs:
  banners:
    name: '🪧 Measure and draw'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the SVGs, the README blocks, the elements' data file and both locks
      pull-requests: write # only used when commit is pr
    outputs:
      changed: ${{ steps.banners.outputs.changed == 'true' || steps.elements.outputs.changed == 'true' }}
      summary: ${{ steps.banners.outputs.summary }}
      elements-changed: ${{ steps.elements.outputs.changed == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch as it is NOW, not as it was when the run was queued,
          # so a run chained after another kit's reads what it committed,
          # and the push below replays onto the tip anyway.
          ref: ${{ github.ref_name }}
          # The roster, the histogram and the milestones read the whole log
          # and every tag.
          fetch-depth: 0
          # The bot commits the drawings and the locks, so the checkout keeps
          # credentials for the pushes below.
          persist-credentials: true # zizmor: ignore[artipacked] - the push steps below need them, and nothing else runs after them.

      # A reusable workflow runs against the CALLER's checkout, so the kit is
      # fetched beside it and run by local path. The action keeps the folder
      # out of git's view; nothing of it reaches the consumer's tree.
      - name: Fetch the kit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tannergolden/banners
          ref: ${{ inputs.kit-ref }}
          path: .banners-kit
          persist-credentials: false

      - id: banners
        name: The banners
        uses: ./.banners-kit
        with:
          mode: ${{ inputs.check && 'check' || 'run' }}
          banner-mode: ${{ inputs.mode }}
          subject: ${{ inputs.subject }}
          header: ${{ inputs.header }}
          footer: ${{ inputs.footer }}
          theme: ${{ inputs.theme }}
          token: ${{ secrets.BANNERS_TOKEN || github.token }}

      # The commit is authored by the kit's author and committed by the bot,
      # so the page shows who drew the banners and the log shows what pushed
      # them. The kit sets its own commits aside when it measures, by their
      # chore(banners) scope and their bot committer, so a refresh never
      # moves the date the footer shows. The message is the one the kit
      # wrote for this run: a Conventional Commit per tannergolden/standards,
      # with a scope, a body that says why, and the values that make it
      # unique. The kit's folder stays for the elements below; the action
      # keeps it out of git's view, and the pathspec keeps it out for sure.
      - name: Commit and push the banners
        if: ${{ steps.banners.outputs.changed == 'true' && inputs.commit != 'pr' }}
        shell: bash
        env:
          MESSAGE_FILE: ${{ steps.banners.outputs.commit-file }}
          AUTHOR: ${{ inputs.author }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.banners-kit'
          git commit --author="$AUTHOR" -F "$MESSAGE_FILE"
          # Another kit may have pushed since this run began: the umbrella in
          # tannergolden/markdown runs the kits in turn, and each writes only
          # its own files and its own README markers. The refresh is replayed
          # onto whatever the branch holds now, and pushed from there.
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      # The body of the page, on the tree the banners just committed. A
      # profile README has no repository to measure, so it gets none; a check
      # runs only where there is a data file to check against.
      - id: elements
        name: The elements
        if: >-
          ${{ inputs.elements
              && (inputs.check && hashFiles('.github/elements.yml') != ''
                  || !inputs.check && steps.banners.outputs.banner-mode != 'profile') }}
        uses: ./.banners-kit/elements
        with:
          mode: ${{ inputs.check && 'check' || 'run' }}
          token: ${{ secrets.ELEMENTS_TOKEN || secrets.BANNERS_TOKEN || github.token }}

      # The elements' own commit, under their own scope, the same way.
      - name: Commit and push the elements
        if: ${{ steps.elements.outputs.changed == 'true' && inputs.commit != 'pr' }}
        shell: bash
        env:
          MESSAGE_FILE: ${{ steps.elements.outputs.commit-file }}
          AUTHOR: ${{ inputs.author }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.banners-kit'
          git commit --author="$AUTHOR" -F "$MESSAGE_FILE"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"

      # A pull request carries both kits' changes as one commit, titled by
      # the banners when they moved and by the elements otherwise, with each
      # kit's own message in the body.
      - name: Drop the kit and word the pull request
        id: author
        if: ${{ (steps.banners.outputs.changed == 'true' || steps.elements.outputs.changed == 'true') && inputs.commit == 'pr' }}
        shell: bash
        env:
          AUTHOR: ${{ inputs.author }}
          BANNERS_CHANGED: ${{ steps.banners.outputs.changed }}
          BANNERS_TITLE: ${{ steps.banners.outputs.commit-title }}
          BANNERS_BODY: ${{ steps.banners.outputs.commit-body }}
          ELEMENTS_CHANGED: ${{ steps.elements.outputs.changed }}
          ELEMENTS_TITLE: ${{ steps.elements.outputs.commit-title }}
          ELEMENTS_BODY: ${{ steps.elements.outputs.commit-body }}
        run: |
          set -euo pipefail
          rm -rf .banners-kit
          # "Name <email>" split for git's author variables
          name="${AUTHOR%%<*}"
          email="${AUTHOR#*<}"
          if [ "$BANNERS_CHANGED" = 'true' ] && [ "$ELEMENTS_CHANGED" = 'true' ]; then
            title="$BANNERS_TITLE"
            body="$BANNERS_BODY"$'\n\n'"Also the elements: $ELEMENTS_TITLE"$'\n\n'"$ELEMENTS_BODY"
          elif [ "$BANNERS_CHANGED" = 'true' ]; then
            title="$BANNERS_TITLE"
            body="$BANNERS_BODY"
          else
            title="$ELEMENTS_TITLE"
            body="$ELEMENTS_BODY"
          fi
          {
            echo "name=${name% }"
            echo "email=${email%>}"
            echo "title=$title"
            echo "body<<EOF"
            printf '%s\n' "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # open-pr commits with git, so the author variables reach it and name
      # the same author as the push above; the committer stays its own.
      - name: Open or update the pull request
        if: ${{ (steps.banners.outputs.changed == 'true' || steps.elements.outputs.changed == 'true') && inputs.commit == 'pr' }}
        uses: tannergolden/standards/actions/open-pr@v1 # zizmor: ignore[unpinned-uses] - first-party action on its moving major, the way every stub calls standards.
        env:
          GIT_AUTHOR_NAME: ${{ steps.author.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.author.outputs.email }}
        with:
          token: ${{ github.token }}
          branch: ${{ inputs.commit-branch }}
          commit-title: ${{ steps.author.outputs.title }}
          commit-body: ${{ steps.author.outputs.body }}
