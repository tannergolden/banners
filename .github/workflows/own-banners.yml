#
# This repository's own banners, in repository mode: the kit eating its own
# cooking. It calls the reusable workflow by LOCAL path, so a change to the
# workflow or the action is exercised by the tree that carries it, the way
# standards' self-checks do, rather than by the last release.
#
# Once a day, at midnight. Every run measures everything again, so a run
# GitHub delays or drops loses nothing: the next one catches up. A day on
# which nothing the banners show has moved writes nothing.

name: '🪧 Own Banners'

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  banners:
    if: ${{ !github.event.repository.is_template }}
    permissions:
      contents: write # the SVGs, the README blocks and the lock
      pull-requests: write # only used with commit: pr
    uses: ./.github/workflows/banners.yml
    with:
      kit-ref: ${{ github.sha }} # the tree that carries this change, not the last release
    secrets: inherit # zizmor: ignore[secrets-inherit] - first-party callee at a local path.
