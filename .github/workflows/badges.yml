# --- This Repository's Own Badges ---
#
# 🏷️ Badges
#
# The README's header badges are committed SVGs drawn by tannergolden/emblems
# from .github/badges.yml, the same way this repository's banners are drawn:
# nothing is fetched when the page is viewed. When the data file changes, this
# re-renders what changed and commits it, authored by the kit's author and
# committed by the bot, per the standards' commit identity protocol. A push
# that leaves the data file alone does nothing.
#
# Called, never copied: the renderer is the emblems action at its moving
# major, so a fix to a glyph or a color reaches this README without anyone
# editing a workflow.

name: '🏷️ Badges'

on:
  push:
    paths:
      - '.github/badges.yml'
      - '.github/workflows/badges.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  badges:
    name: '🏷️ Redraw the badges'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the re-rendered SVGs
    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/actions/harden@v1
        with:
          egress-policy: audit
          notice: '🏷️ Badges: redraws the README badges from .github/badges.yml through the emblems action.'

      - name: '📥 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] - the action commits and pushes what it redrew

      - name: '🏷️ Render and commit'
        uses: tannergolden/emblems@v1 # zizmor: ignore[unpinned-uses] - first-party action on its moving major, the way every stub calls standards.
        with:
          mode: render
          commit: true
